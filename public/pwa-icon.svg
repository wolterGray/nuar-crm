<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Surface Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15121A"/>
      <stop offset="45%" stop-color="#0D0A11"/>
      <stop offset="100%" stop-color="#060508"/>
    </linearGradient>

    <!-- Warm Golden Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#E2C075" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#E2C075" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Champagne Gold Gradient for the N Monogram -->
    <linearGradient id="gold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="20%" stop-color="#F5DEAE"/>
      <stop offset="50%" stop-color="#DEB36D"/>
      <stop offset="80%" stop-color="#BA8840"/>
      <stop offset="100%" stop-color="#E5C384"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Monogram Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#DEB36D" flood-opacity="0.12"/>
    </filter>

  </defs>

  <!-- Full-bleed opaque artwork: the operating system applies its own icon mask. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#centerGlow)"/>

  <path
    d="M 156,138
       L 197,138
       L 315,325
       L 315,138
       L 356,138
       L 356,374
       L 315,374
       L 197,187
       L 197,374
       L 156,374
       Z"
    fill="url(#gold)"
    filter="url(#shadow)"
  />
</svg>
