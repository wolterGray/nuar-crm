<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Surface Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15121A"/>
      <stop offset="45%" stop-color="#0D0A11"/>
      <stop offset="100%" stop-color="#060508"/>
    </linearGradient>

    <!-- Warm Golden Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#E2C075" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#E2C075" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Champagne Gold Gradient for the N Monogram -->
    <linearGradient id="gold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="20%" stop-color="#F5DEAE"/>
      <stop offset="50%" stop-color="#DEB36D"/>
      <stop offset="80%" stop-color="#BA8840"/>
      <stop offset="100%" stop-color="#E5C384"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Monogram Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#DEB36D" flood-opacity="0.12"/>
    </filter>

    <!-- Precision Squircle Mask -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#centerGlow)"/>

    <!-- Subtle Inset Gold Hairline Border -->
    <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#E2C075" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Single Unified Monogram N -->
    <path
      d="M 148,130
         L 192,130
         L 320,332
         L 320,130
         L 364,130
         L 364,382
         L 320,382
         L 192,180
         L 192,382
         L 148,382
         Z"
      fill="url(#gold)"
      filter="url(#shadow)"
    />
  </g>
</svg>